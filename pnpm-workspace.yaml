packages:
  - packages/*
  - apps/*
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  # ERD (pnpm db:erd): Puppeteer downloads its Chromium at install time (into
  # ~/.cache/puppeteer, outside node_modules → absent from prod images). Docker
  # builds skip it via PUPPETEER_SKIP_DOWNLOAD (they never render the ERD).
  # Il est déclaré dans @sirena/db (au lieu d'être une peer auto-installée de
  # @mermaid-js/mermaid-cli) pour tenir la v25 : les v23/v24 embarquent
  # @puppeteer/browsers 2.x, donc extract-zip 2.0.1, dont les traversées de
  # chemin par lien symbolique n'ont jamais été corrigées (GHSA-jmr9-qjv8-65gv,
  # GHSA-7pqw-9j4j-h8q3 ; dernière publication : 2020). @puppeteer/browsers 3
  # l'a remplacé par modern-tar.
  puppeteer: true
catalog:
  "@biomejs/biome": ^2.5.14
  "@codegouvfr/react-dsfr": ^1.35.0
  "@hono/standard-validator": ^0.4.0
  "@prisma/adapter-pg": ^7.10.0
  "@prisma/client": ^7.10.0
  "@tanstack/react-router": ^1.170.40
  "@testing-library/dom": ^10.4.2
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.7
  "@types/node": ^26.6.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  "@vitest/browser": ^4.1.11
  "@vitest/coverage-v8": ^4.1.11
  clsx: ^2.1.1
  dotenv: ^17.4.2
  hono: ^4.13.10
  hono-openapi: ^1.3.3
  jsdom: ^30.1.1
  prisma: ^7.10.0
  react: ^19.3.0
  react-dom: ^19.3.0
  tsx: ^4.23.15
  typescript: ~7.0.2
  vite: ^8.3.1
  vitest: ^4.1.11
  zod: ^4.6.5
enablePrePostScripts: true
minimumReleaseAge: 10080
# Security fixes (see overrides) whose patched version is less than 7 days old:
# waive the maturation delay for these packages only, so the audit can pass.
minimumReleaseAgeExclude:
  # source-map-js 1.2.2 (GHSA-68fv-2mgg-jv7q) : publié le 2026-09-30, donc encore
  # en quarantaine. Entrée à retirer à partir du 2026-10-08.
  - source-map-js
overrides:
  # Planchers de sécurité sur des paquets tirés transitivement (@sentry/cli,
  # ajv via prisma/commitlint, minio) : leurs ranges parents résolvent aujourd'hui
  # une version saine, mais on garde le plancher pour que le nettoyage annuel des
  # ranges en amont ne réintroduise pas silencieusement la vuln.
  "undici@>=6.25.0 <6.28.1": "6.28.1"
  "undici@>=8.1.0 <8.10.2": "8.10.2"
  # decode-uri-component <=0.4.2 : DoS via une entrée percent-encoded malformée — GHSA-vcc3-ghjq-m6fr.
  "decode-uri-component@<=0.4.2": ">=0.5.0"
  # fast-uri host confusion / SSRF via malformed URL normalization, pulled in
  # by ajv (prisma/commitlint) — GHSA-7p8r-x3mc-p8w7, GHSA-5jgf-p345-68v8,
  # GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp.
  # ajv demande ^3 : on reste en v3 (borne ^ indispensable, sinon la plage
  # ouverte résout la v4, vulnérable). Les sélecteurs pnpm matchent la plage
  # demandée par le parent, pas la version résolue.
  "fast-uri@>=3.0.0 <3.1.5": "^3.1.5"
  # brace-expansion (via minimatch) : DoS par récursion non bornée et expansion
  # quadratique — patché en 5.0.12.
  "brace-expansion@>=5.0.0 <5.0.12": "^5.0.12"
  # mysql2 : fuite d'identifiants par downgrade du plugin d'authentification et
  # bombe de décompression zlib — GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3.
  "mysql2@<=3.23.0": ">=3.23.1"
  # fast-xml-parser : reset des déclarations DOCTYPE répétées — GHSA-8r6m-32jq-jx6q.
  "fast-xml-parser@>=5.9.3 <5.10.1": ">=5.10.1"
  # js-yaml <4.3.2 : les sources de fusion vides échappent à maxTotalMergeKeys,
  # d'où une consommation CPU non bornée — GHSA-2883-xcg3-v3hh. Tiré par
  # cosmiconfig (commitlint, @graphql-codegen/cli).
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
  # shell-quote <1.11.0 : injection de commande via un terminateur de ligne dans
  # un token placé après un token `{ comment }` — GHSA-pqg4-j6r4-53mv. Tiré par
  # @graphql-codegen/cli (qui demande ^1.7.3).
  "shell-quote@>=1.8.4 <1.11.0": "^1.11.0"
  # source-map-js <1.2.2 : DoS de la boucle d'événements via les offsets de
  # sections indexées d'une source map — GHSA-68fv-2mgg-jv7q. Tiré par postcss
  # (vite) et magicast (@prisma/config, @vitest/coverage-v8).
  "source-map-js@>=1.0.0 <1.2.2": "^1.2.2"
  # @graphql-tools/utils <=12.0.0 : pollution de prototype dans `mergeDeep` —
  # GHSA-7mx3-vvmw-hjmv. Seul graphql-config (via @graphql-codegen/cli) reste en
  # ^11 ; la 12.0.1 est déjà résolue pour le reste de l'arbre codegen et n'est
  # qu'additive face à la 11.2.2 (ajout de getDirectiveValues).
  "@graphql-tools/utils@<=12.0.0": "^12.0.1"
auditConfig:
  ignoreGhsas:
    # deepmerge-ts <8: stack exhaustion requires attacker-controlled cyclic
    # JavaScript object graphs. Current consumers use static configuration, and
    # Prisma pins 7.1.5; remove when upstream supports deepmerge-ts >=8.
    - GHSA-ggr8-5vv4-36mx
    # stream-json (MinIO, ^1.8.0): the three advisories below all target code paths
    # MinIO never reaches. `minio/notification` imports only `stream-json/jsonl/Parser.js`,
    # whose parse loop is a plain `JSON.parse` per line: no pick/ignore/filter/replace
    # filter (GHSA-528h-pc64-c93x), no JSONC comment scanner (GHSA-hqr4-qq8f-hg3x) and
    # no Assembler (GHSA-mjw6-4jj6-33hc). An override is not an option either: the fixes
    # land in 3.6.0/3.5.1, and stream-json 3.x moved that entry point to
    # `src/jsonl/parser.js`, so forcing 3.x breaks MinIO's import on a case-sensitive
    # filesystem. Remove when MinIO itself moves to stream-json >=3.6.
    - GHSA-528h-pc64-c93x
    - GHSA-hqr4-qq8f-hg3x
    - GHSA-mjw6-4jj6-33hc
    # braces <=3.0.3 (CVE-2026-93687): stack overflow in the recursive AST walkers.
    # No patched release exists yet (the advisory names 3.0.4, which is not published
    # on npm), so neither an override nor a bump can resolve it today. braces only
    # enters the tree through @graphql-codegen/cli (a devDependency of @sirena/backend,
    # via micromatch): never in a production image, and the globs it receives come from
    # our codegen config, not from user input. Remove once braces ships the fix.
    - GHSA-vfj7-8cjw-p6xm
