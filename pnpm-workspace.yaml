packages:
  - packages/*
  - apps/*
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  # ERD (pnpm db:erd): Puppeteer downloads its Chromium at install time (into
  # ~/.cache/puppeteer, outside node_modules → absent from prod images). Docker
  # builds skip it via PUPPETEER_SKIP_DOWNLOAD (they never render the ERD).
  puppeteer: true
catalog:
  "@biomejs/biome": ^2.5.10
  "@codegouvfr/react-dsfr": ^1.33.0
  "@hono/standard-validator": ^0.4.0
  "@prisma/adapter-pg": ^7.9.1
  "@prisma/client": ^7.9.1
  "@tanstack/react-router": ^1.170.32
  "@testing-library/dom": ^10.4.1
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.2
  "@testing-library/user-event": ^14.6.6
  "@types/node": ^26.2.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  "@vitejs/plugin-react": ^6.1.0
  "@vitest/browser": ^4.1.11
  "@vitest/coverage-v8": ^4.1.11
  clsx: ^2.1.1
  dotenv: ^17.4.2
  hono: ^4.13.4
  hono-openapi: ^1.3.1
  jsdom: ^30.0.1
  prisma: ^7.9.1
  react: ^19.2.8
  react-dom: ^19.2.8
  tsx: ^4.23.12
  typescript: ~7.0.2
  vite: ^8.2.2
  vitest: ^4.1.11
  zod: ^4.4.3
enablePrePostScripts: true
minimumReleaseAge: 10080
# Security fixes (see overrides) whose patched version is less than 7 days old:
# waive the maturation delay for these packages only, so the audit can pass.
minimumReleaseAgeExclude: []
overrides:
  # Planchers de sécurité sur des paquets tirés transitivement (@sentry/cli,
  # ajv via prisma/commitlint, minio) : leurs ranges parents résolvent aujourd'hui
  # une version saine, mais on garde le plancher pour que le nettoyage annuel des
  # ranges en amont ne réintroduise pas silencieusement la vuln.
  undici@>=6.26.0 <6.27.0: ^6.27.0
  # decode-uri-component <=0.4.2 : DoS via une entrée percent-encoded malformée — GHSA-vcc3-ghjq-m6fr.
  "decode-uri-component@<=0.4.2": ">=0.5.0"
  # fast-uri host confusion / SSRF via malformed URL normalization, pulled in
  # by ajv (prisma/commitlint) — GHSA-7p8r-x3mc-p8w7, GHSA-5jgf-p345-68v8,
  # GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp.
  "fast-uri@>=3.0.0 <3.1.5": ">=3.1.5"
  "fast-uri@>=4.0.0 <4.1.3": ">=4.1.3"
  # mysql2 : fuite d'identifiants par downgrade du plugin d'authentification et
  # bombe de décompression zlib — GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3.
  "mysql2@<=3.23.0": ">=3.23.1"
  # fast-xml-parser : reset des déclarations DOCTYPE répétées — GHSA-8r6m-32jq-jx6q.
  "fast-xml-parser@>=5.9.3 <5.10.1": ">=5.10.1"
# extract-zip <=2.0.1: symlink path traversal — GHSA-jmr9-qjv8-65gv. Aucune
# version corrigée n'a jamais été publiée sur npm (dernière release : 2.0.1,
# 2020), un override est donc impossible. Tiré par prisma-erd-generator >
# @mermaid-js/mermaid-cli > puppeteer(-core) > @puppeteer/browsers (db:erd
# only ; zips générés localement, pas de contenu attaquant).
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    # deepmerge-ts <8: stack exhaustion requires attacker-controlled cyclic
    # JavaScript object graphs. Current consumers use static configuration, and
    # Prisma pins 7.1.5; remove when upstream supports deepmerge-ts >=8.
    - GHSA-ggr8-5vv4-36mx
