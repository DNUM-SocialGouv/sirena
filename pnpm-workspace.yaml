packages:
  - packages/*
  - apps/*
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  # ERD (pnpm db:erd): Puppeteer downloads its Chromium at install time (into
  # ~/.cache/puppeteer, outside node_modules → absent from prod images). Docker
  # builds skip it via PUPPETEER_SKIP_DOWNLOAD (they never render the ERD).
  puppeteer: true
catalog:
  "@biomejs/biome": ^2.5.5
  "@codegouvfr/react-dsfr": ^1.32.4
  "@hono/standard-validator": ^0.3.0
  "@prisma/adapter-pg": ^7.9.0
  "@prisma/client": ^7.9.0
  "@tanstack/react-router": ^1.170.18
  "@testing-library/dom": ^10.4.1
  "@testing-library/jest-dom": ^7.0.0
  "@testing-library/react": ^16.3.2
  "@testing-library/user-event": ^14.6.1
  "@types/node": ^26.1.1
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@vitejs/plugin-react": ^6.0.4
  "@vitest/browser": ^4.1.10
  "@vitest/coverage-v8": ^4.1.10
  clsx: ^2.1.1
  dotenv: ^17.4.2
  hono: ^4.12.34
  hono-openapi: ^1.3.1
  jsdom: ^30.0.0
  prisma: ^7.9.0
  react: ^19.2.8
  react-dom: ^19.2.8
  tsx: ^4.23.1
  typescript: ~7.0.2
  vite: ^8.1.5
  vitest: ^4.1.10
  zod: ^4.4.3
enablePrePostScripts: true
minimumReleaseAge: 10080
# Security fixes (see overrides) whose patched version is less than 7 days old:
# waive the maturation delay for these packages only, so the audit can pass.
minimumReleaseAgeExclude:
  - fast-uri
  - brace-expansion
  - hono
overrides:
  # Planchers de sécurité sur des paquets tirés transitivement (@sentry/cli,
  # ajv via prisma/commitlint, minio) : leurs ranges parents résolvent aujourd'hui
  # une version saine, mais on garde le plancher pour qu'un downgrade en amont ne
  # réintroduise pas silencieusement la vuln.
  undici@>=6.26.0 <6.27.0: ^6.27.0
  # fast-uri host confusion via backslash authority introducer, pulled in by ajv
  # (prisma/commitlint) — GHSA-7p8r-x3mc-p8w7 (extends GHSA-v2hh-gcrm-f6hx).
  "fast-uri@>=3.0.0 <3.1.5": ">=3.1.5"
  # fast-xml-parser : reset des déclarations DOCTYPE répétées — GHSA-8r6m-32jq-jx6q.
  "fast-xml-parser@>=5.9.3 <5.10.1": ">=5.10.1"
  # find-my-way <=9.6.0 : DDoS HTTP/2 (GHSA-c96f-x56v-gq3h), tiré par prisma > @prisma/dev.
  # Le correctif annoncé en 9.6.1 n'a jamais été publié : 9.7.0 est la première version saine.
  "find-my-way@<9.7.0": ">=9.7.0"
  # brace-expansion: DoS via unbounded intermediate arrays, bypasses the
  # CVE-2026-14257 mitigation — GHSA-rgw5-rvv9-x895. Scoped to the 5.x branch,
  # the only one present in the tree (minimatch, glob).
  "brace-expansion@>=5.0.0 <5.0.9": ">=5.0.9"
  # valibot <=1.4.1 : flatten() throw sur les noms de propriétés héritées d'Object
  # dans les issue paths de record() — GHSA-5qjj-4xww-7phc.
  "valibot@<1.4.2": ">=1.4.2"
  # postcss <=8.5.22: attacker-controlled sourceMappingURL → reads arbitrary
  # .map files when `from` is unset — GHSA-6g55-p6wh-862q (incomplete fix).
  "postcss@<8.5.23": ">=8.5.23"
  # hono <4.12.34: ReDoS in the CORS middleware. Aligns the transitive tree
  # (prisma > @prisma/dev); direct consumers are on ^4.12.34 via the catalog.
  "hono@<4.12.34": ">=4.12.34"
