---
anonymize:
  enabled: true

  sirena_db_secret_path: databases/sirena-production
  anonymize_db_secret_path: databases/sirena-production-anonymisation

sirec-restore:
  enabled: true
  config:
    # Prod = vraies données : on ne restaure PAS les dumps anonymisés
    # (`dumps_prod_anon/` = défaut du chart, réservé aux envs de dev/integration).
    dumpObjectPrefix: "dumps_prod/"

backend:
  SDPSN-devops-charts:
    namespace: org-sdpsn-ws-sirena-production

    certificateIssuer:
      enable: true
      name: digicert
      keyID: Diez7rvaK3Kj_HZd6LBslW_82l2Lqg4xmUXzc_FyxQo
      server: https://one.nl.digicert.com/mpki/api/v1/acme/v2/directory
      vaultKeystoreName: certificats-digicert

    appVariables:
      DEMAT_SOCIAL_API_DIRECTORY: "923"
      DEMAT_SOCIAL_API_URL: "https://demat.social.gouv.fr/api/v2/graphql"
      HOST: https://sirena-sante.social.gouv.fr
      PC_DOMAIN: https://auth.agentconnect.gouv.fr/api/v2
      PC_REDIRECT_URI: https://sirena-sante.social.gouv.fr/api/auth/callback
      FRONTEND_REDIRECT_URI: https://sirena-sante.social.gouv.fr/home
      FRONTEND_REDIRECT_LOGIN_URI: https://sirena-sante.social.gouv.fr/login
      FRONTEND_URI: https://sirena-sante.social.gouv.fr
      REDIS_TLS: "true"
      PG_SSL_ALLOW_SELF_SIGNED: "true"
      APP_ENV: production
      TIPIMAIL_DISABLE_SENDING: "false"
      REDIS_MIGRATION_CONCURRENCY: "50"

    deployment:
      replicas: 2

    ingress:
      host: sirena-sante.social.gouv.fr
      appAnnotations:
        external-dns.alpha.kubernetes.io/hostname: sirena-sante.social.prod.atlas.fabrique.social.gouv.fr
        external-dns.alpha.kubernetes.io/target: 79.137.10.7
      tls:
        hosts:
          - sirena-sante.social.gouv.fr
          - sirena-sante.social.prod.atlas.fabrique.social.gouv.fr

external-secrets:
  externalSecret:
    database:
      databaseName: sirena-production
    mariadbSirec:
      enable: true
      host: "mariadb.org-sdpsn-ws-sirena-services-production.svc.cluster.local"
      db: "sirec"
      user: "sirec"
    migrationBucket:
      enable: true
      bucketName: sirena-migration-s3-prod

  SDPSN-devops-charts:
    externalSecret:
      redis:
        clusterName: sirena-production-redis
      bucket:
        bucketName: sirena-production-s3

frontend:
  SDPSN-devops-charts:
    namespace: org-sdpsn-ws-sirena-production

    appVariables:
      APP_ENV: production
      MATOMO_SITE_ID: "154"

    certificateIssuer:
      enable: true
      name: digicert
      keyID: Diez7rvaK3Kj_HZd6LBslW_82l2Lqg4xmUXzc_FyxQo
      server: https://one.nl.digicert.com/mpki/api/v1/acme/v2/directory
      vaultKeystoreName: certificats-digicert

    deployment:
      replicas: 2

    ingress:
      host: sirena-sante.social.gouv.fr
      appAnnotations:
        external-dns.alpha.kubernetes.io/hostname: sirena-sante.social.prod.atlas.fabrique.social.gouv.fr
        external-dns.alpha.kubernetes.io/target: 79.137.10.7
      tls:
        hosts:
          - sirena-sante.social.gouv.fr
          - sirena-sante.social.prod.atlas.fabrique.social.gouv.fr

worker:
  SDPSN-devops-charts:
    deployment:
      replicas: 2
