name: Lint and Unit Tests

on:
  push:

concurrency:
  group: lint-test-${{ github.ref }}
  # On protected branches we let runs finish (post-merge signal matters).
  # On feature branches, cancel previous runs when new commits land.
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/main","refs/heads/validation","refs/heads/production","refs/heads/preproduction","refs/heads/formation"]'), github.ref) }}

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    # Non-blocking: vulnerability surface is reviewed but does not gate merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

  gitleaks:
    name: GitLeaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Run GitLeaks
        run: bash .husky/gitleaks-detect-secrets-ci.sh

  commit-attribution:
    name: Commit attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check walks the pushed commits, so it needs their messages.
          fetch-depth: 0
      - name: Check commit attribution
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # On a branch's first push, `before` is the null SHA: fall back to
          # everything the branch adds on top of the default branch.
          if git rev-parse --verify --quiet "${BEFORE}^{commit}" > /dev/null; then
            RANGE="${BEFORE}..${{ github.sha }}"
          else
            git fetch --quiet origin "${DEFAULT_BRANCH}"
            RANGE="FETCH_HEAD..HEAD"
          fi
          bash .husky/check-commit-attribution-ci.sh "$RANGE"

  lint-build-test:
    name: Lint, Build and Unit Tests
    runs-on: ubuntu-latest
    env:
      PG_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # actions/setup-node already caches the global pnpm store; this layer
          # caches the project-level node_modules trees so install becomes a
          # near no-op when the lockfile is unchanged.
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: pnpm-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run linter
        run: pnpm lint

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace packages (parallel, topological)
        run: pnpm --filter "@sirena/backend..." --workspace-concurrency=4 run build

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test:unit
